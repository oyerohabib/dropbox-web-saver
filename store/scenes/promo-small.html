<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        width: 440px;
        height: 280px;
        padding: 0 36px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 100% 0%, rgba(255, 255, 255, 0.18), transparent 50%),
          linear-gradient(135deg, #0061fe, #0047c2);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
      }
      .name {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }
      .tagline {
        font-size: 18px;
        line-height: 1.35;
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img alt="" src="/icons/128.png" />
      <div class="name">Web Saver<br />for Dropbox</div>
    </div>
    <div class="tagline">Save images, videos and files from any page straight to your Dropbox.</div>
  </body>
</html>
