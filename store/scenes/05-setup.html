<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="scene.css" />
    <script src="scene.js"></script>
  </head>
  <body class="scene">
    <div class="copy" style="max-width: 380px">
      <div class="brand"><img alt="" src="/icons/128.png" />Web Files to Cloud</div>
      <h1>Private by design.</h1>
      <p>Connect Dropbox or Google Drive in a few seconds. Sign in if asked, then click Allow. There is no extra server.</p>
      <ul class="checks">
        <li>Tokens stay in your browser</li>
        <li>No analytics or tracking</li>
        <li>Open source under the MIT license</li>
      </ul>
    </div>

    <div class="window" style="width: 700px; height: 300px">
      <div class="titlebar"><span class="dots"><i></i><i></i><i></i></span>Web Files to Cloud – Settings</div>
      <iframe id="frame" src="/options.html?scene=setup"></iframe>
    </div>

    <script>
      sceneFrame(document.getElementById("frame"), {
        css: ".hero, .page-nav, .page-footer, #preferences, #supported-files, #recent-saves, #walkthrough { display: none !important; } .app-shell { padding-top: 20px; }",
      });
    </script>
  </body>
</html>
