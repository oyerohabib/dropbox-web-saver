name: Bug report
description: Something isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please don't include your Dropbox app key, app secret, or any tokens.
        Security issues should be reported privately, as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, including any error message you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For example, the kind of page and file you were saving, and which menu item or button you used.
      placeholder: |
        1. Open a page with ...
        2. Right-click ... and choose ...
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in chrome://extensions, or filled in automatically when you use Send feedback.
      placeholder: "0.1.0"
  - type: input
    id: browser
    attributes:
      label: Browser and environment
      placeholder: "Chrome 141 on macOS"
