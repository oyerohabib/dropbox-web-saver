name: General feedback
description: Share what you like, what's confusing, or anything else.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: textarea
    id: description
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.1.0"
  - type: input
    id: browser
    attributes:
      label: Browser and environment
      placeholder: "Chrome 141 on macOS"
